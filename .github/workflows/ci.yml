# ============================================================
# HireFlo — GitHub Actions CI + GHCR publish + Render deploy
# ============================================================
#
# Jobs
# ----
# 1. lint     — ruff check .
# 2. test     — pytest -v  (424 tests, no real LLM calls)
# 3. docker   — build, smoke-test, push to GHCR, trigger Render deploy
#
# Push behaviour
# --------------
# push to main branch  → build + smoke test + push to GHCR
#                        tags: latest, <commit-sha>
#                        → trigger Render deploy hook with sha-<short> imgURL
# push of a v* tag     → build + smoke test + push to GHCR
#                        tags: <version>, latest, <commit-sha>
#                        (no Render trigger by default — see step condition)
# pull_request         → build + smoke test only (NO push, NO deploy)
#
# Registry
# --------
# ghcr.io/<owner>/hireflo
# The owner is resolved dynamically from github.repository_owner
# so the workflow works for any fork without hardcoding a username.
#
# Authentication
# --------------
# Uses the auto-generated GITHUB_TOKEN (no PAT required).
# permissions.packages: write is set at the workflow level.
#
# Secrets
# -------
# No application secrets required for lint / test / build.
# OPENROUTER_API_KEY is NOT needed — all 424 tests use a fake LLM.
# GITHUB_TOKEN is provided automatically by GitHub Actions.
# RENDER_DEPLOY_HOOK_URL must be added manually:
#   GitHub repo → Settings → Secrets and variables → Actions
#   → New repository secret → name: RENDER_DEPLOY_HOOK_URL
#   → value: the deploy hook URL from Render Dashboard
# ============================================================

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"          # trigger on version tags, e.g. v1.0.0
  pull_request:

# Minimal permissions — read source, write packages (GHCR).
permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v
        env:
          # Ensure tests run in offline test mode — no real LLM calls.
          APP_ENV: test

  # ── 3. Docker build + push ─────────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    # Only run after both lint and tests pass.
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Generate OCI-compliant image tags and labels ──────────────────────
      # docker/metadata-action reads the triggering event and produces:
      #   push to main      → :latest, :<sha-short>
      #   push of v* tag    → :<version>, :latest, :<sha-short>
      #   pull_request       → :<pr-N>  (used for build only, not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hireflo
          tags: |
            # semver from git tag (v1.2.3 → 1.2.3, also adds :latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # short SHA — immutable reference to the exact source commit
            type=sha,prefix=sha-
            # "latest" on every push to main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=HireFlo
            org.opencontainers.image.description=AI Recruitment Agent — LangGraph + Streamlit
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Log in to GHCR (skipped for pull requests from forks) ─────────────
      # GITHUB_TOKEN is provided automatically — no PAT required.
      # login-action is skipped on PRs from external forks because the token
      # does not have write permission in that context.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build (and push when not a PR) ────────────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only on push events (main branch or version tags).
          # pull_request events never push to the registry.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse GitHub Actions layer cache to speed up repeated builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Smoke test (always — build + PR + push) ────────────────────────────
      # Load the image locally regardless of push status so we can smoke-test it.
      - name: Load image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true          # load into the local Docker daemon for the next step
          push: false
          tags: hireflo:ci
          cache-from: type=gha

      - name: Smoke-test container
        run: |
          docker run -d \
            --name hireflo-smoke \
            -p 8501:8501 \
            -e APP_ENV=test \
            -e OPENROUTER_API_KEY=dummy \
            hireflo:ci

          echo "Waiting for Streamlit health endpoint..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo ""
              echo "✅  Streamlit is healthy (attempt $i)"
              break
            fi
            echo "  attempt $i/10 — not ready yet, sleeping 3 s"
            sleep 3
          done

          curl -sf http://localhost:8501/_stcore/health || \
            (echo "❌  Streamlit health check failed" && docker logs hireflo-smoke && exit 1)

          docker stop hireflo-smoke
          docker rm hireflo-smoke

      # ── Report published digest ────────────────────────────────────────────
      - name: Report image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image pushed to GHCR"
          echo "   Tags : ${{ steps.meta.outputs.tags }}"
          echo "   Digest: ${{ steps.build.outputs.digest }}"

      # ── Trigger Render deployment ──────────────────────────────────────────
      # Only run on push to main (not on PRs or version tags, unless you also
      # want tag pushes to auto-deploy — adjust the condition as needed).
      #
      # The hook URL is stored as a repository secret (RENDER_DEPLOY_HOOK_URL).
      # It must be set manually in GitHub → Settings → Secrets → Actions.
      #
      # We pass the exact SHA tag via imgURL so Render deploys the specific
      # immutable image that was just pushed, not whatever :latest resolves to
      # at pull time.  This makes every production deployment fully reproducible.
      #
      # imgURL format: <registry>%2F<owner>%2F<repo>%3A<tag>
      # (URL-encoded slashes and colon)
      #
      # RENDER_DEPLOY_HOOK_URL is expected to be the base hook URL provided
      # by Render Dashboard → Service → Settings → Deploy Hook.
      # Example base URL (not real):
      #   https://api.render.com/deploy/srv-abc123?key=xyz
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          # The short SHA tag generated by metadata-action (e.g. sha-b43fc5b).
          # We extract it from the full tags output.
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: sha-${{ github.sha }}
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          # Build the URL-encoded imgURL parameter.
          # Format: ghcr.io/<owner>/hireflo:sha-<short>
          # URL-encode: / → %2F, : → %3A
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMG_TAG="sha-${SHORT_SHA}"
          IMG_URL="ghcr.io%2F${IMAGE_OWNER}%2Fhireflo%3A${IMG_TAG}"

          echo "🚀 Triggering Render deployment with image tag: sha-${SHORT_SHA}"

          # Pass the hook URL via env var — never echo it.
          HTTP_STATUS=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}")

          echo "   Render response HTTP status: ${HTTP_STATUS}"
          cat /tmp/render_response.json

          if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "202" ]; then
            echo "✅ Render deployment triggered successfully"
          else
            echo "❌ Render deployment trigger failed (HTTP ${HTTP_STATUS})"
            exit 1
          fi
