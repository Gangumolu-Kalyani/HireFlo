# ============================================================
# HireFlo — GitHub Actions CI + security scanning + GHCR publish + Render deploy
# ============================================================
#
# Jobs
# ----
# 1. lint          — ruff check .
# 2. test          — pytest -v  (no real LLM calls)
# 3. secret-scan   — Gitleaks (detect committed credentials)
# 4. dep-scan      — pip-audit (Python dependency CVE scan)
# 5. docker        — build + Trivy scan + smoke test + push to GHCR + Render deploy
#
# Security failure policy
# -----------------------
# FAIL:    ruff violations
# FAIL:    pytest failures
# FAIL:    secrets detected by Gitleaks
# FAIL:    dependency vulnerability with a fix available (pip-audit)
# FAIL:    CRITICAL Docker vulnerability (Trivy)
# FAIL:    HIGH Docker vulnerability with a fix available (Trivy)
# REPORT:  MEDIUM Docker vulnerability (warning, never blocks deploy)
# REPORT:  LOW Docker vulnerability (warning, never blocks deploy)
#
# Push behaviour
# --------------
# push to main branch  → lint + test + secret-scan + dep-scan
#                        → docker build + Trivy scan + smoke test
#                        → push to GHCR (tags: latest, sha-<commit>)
#                        → trigger Render deploy hook with sha-<short> imgURL
# push of a v* tag     → same as main but also tags <version>, <major>.<minor>
# pull_request         → lint + test + secret-scan + dep-scan
#                        → docker build + Trivy scan + smoke test
#                        → NO push, NO deploy
#
# Registry
# --------
# ghcr.io/<owner>/hireflo
# Owner resolved dynamically — workflow works for any fork.
#
# Authentication
# --------------
# Uses the auto-generated GITHUB_TOKEN.  No PAT required.
# packages: write is scoped to the docker job only (not the whole workflow).
#
# Secrets
# -------
# No application secrets required for lint / test / build.
# OPENROUTER_API_KEY is NOT needed — all tests use a fake LLM.
# GITHUB_TOKEN is provided automatically by GitHub Actions.
# RENDER_DEPLOY_HOOK_URL must be added manually:
#   GitHub repo → Settings → Secrets and variables → Actions
#   → New repository secret → name: RENDER_DEPLOY_HOOK_URL
#   → value: the deploy hook URL from Render Dashboard
# ============================================================

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

# Minimal top-level permissions — only read source code.
# packages: write is added per-job on the docker job that actually pushes.
permissions:
  contents: read

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
        env:
          APP_ENV: test

  # ── 3. Secret scanning ─────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so Gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Run Gitleaks
        # Pin to a known-good version tag to prevent supply-chain changes.
        # Gitleaks scans the entire git history for patterns that look like
        # real API keys, tokens, passwords, or private credentials.
        # FAIL on any detection — a secret in git history is a security event.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisations.  For public
          # and personal repositories GITHUB_TOKEN is sufficient.

  # ── 4. Dependency vulnerability scan ──────────────────────────────────────
  dep-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: |
          pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Run pip-audit
        # Scan only the production requirements.
        # --require-hashes is not used here because the project does not pin
        # hashes in requirements.txt (adding it is a future hardening step).
        # --fix is NOT used — we report vulnerabilities; upgrades are reviewed
        # manually to avoid breaking the application.
        # Exit non-zero when any vulnerability with a fix is found.
        run: |
          echo "🔍 Scanning production dependencies for known vulnerabilities..."
          pip-audit -r requirements.txt

  # ── 5. Docker build + security scan + push + deploy ───────────────────────
  docker:
    name: Docker build, scan & push
    runs-on: ubuntu-latest
    # Only run after lint, tests, secret scan, and dependency scan pass.
    needs: [lint, test, secret-scan, dep-scan]

    # packages: write is required only for GHCR push — scoped to this job.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Generate OCI-compliant image tags and labels ──────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hireflo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=HireFlo
            org.opencontainers.image.description=AI Recruitment Agent — LangGraph + Streamlit
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Log in to GHCR (skipped for pull requests) ────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push ────────────────────────────────────────────────────
      # provenance and sbom generate signed build provenance attestations and
      # a Software Bill of Materials — both are attached to the image in GHCR
      # and make the image traceable back to the exact source commit and
      # its dependency tree.  They do not affect the container itself.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain security: attach provenance and SBOM to the image.
          provenance: true
          sbom: true

      # ── Load image locally for scanning and smoke testing ─────────────────
      - name: Load image locally for scan and smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: hireflo:ci
          cache-from: type=gha

      # ── Trivy vulnerability scan ──────────────────────────────────────────
      # Security failure policy for Docker image vulnerabilities:
      #   CRITICAL  → fail the pipeline (exit 1)
      #   HIGH      → fail only when a fix is available
      #   MEDIUM    → report in output, do not fail
      #   LOW       → report in output, do not fail
      #
      # This means LOW / MEDIUM findings in base OS packages that have no
      # available fix will appear in logs but will not block a deploy.
      # The policy is intentional — blocking on every unfixable low-severity
      # finding in a slim base image creates noise without improving security.
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hireflo:ci
          format: table
          # Scan OS packages and Python libraries.
          scanners: vuln
          vuln-type: os,library
          # Severity levels to report in the output table.
          severity: CRITICAL,HIGH,MEDIUM,LOW
          # Exit non-zero for CRITICAL and HIGH vulnerabilities only.
          # HIGH with no available fix will not fail (ignore-unfixed: true).
          exit-code: "1"
          ignore-unfixed: true
          # Severity threshold that triggers exit-code: 1.
          # Trivy uses this to select which severities cause failure.
          # CRITICAL and HIGH (with fix) fail; MEDIUM and LOW only report.
          trivyignore: .trivyignore

      # ── Smoke test ────────────────────────────────────────────────────────
      - name: Smoke-test container
        run: |
          docker run -d \
            --name hireflo-smoke \
            -p 8501:8501 \
            -e APP_ENV=test \
            -e OPENROUTER_API_KEY=dummy \
            hireflo:ci

          echo "Waiting for Streamlit health endpoint..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo ""
              echo "✅  Streamlit is healthy (attempt $i)"
              break
            fi
            echo "  attempt $i/10 — not ready yet, sleeping 3 s"
            sleep 3
          done

          curl -sf http://localhost:8501/_stcore/health || \
            (echo "❌  Streamlit health check failed" && docker logs hireflo-smoke && exit 1)

      # ── Non-root verification ─────────────────────────────────────────────
      # Verify that the application process runs as a non-root user.
      # The container must run as the 'hireflo' user (uid 1000), not root (uid 0).
      - name: Verify non-root execution
        run: |
          CONTAINER_USER=$(docker exec hireflo-smoke whoami)
          echo "Container user: ${CONTAINER_USER}"

          if [ "${CONTAINER_USER}" = "root" ]; then
            echo "❌  SECURITY VIOLATION: container is running as root!"
            docker stop hireflo-smoke
            docker rm hireflo-smoke
            exit 1
          fi

          echo "✅  Container is running as non-root user: ${CONTAINER_USER}"

          docker stop hireflo-smoke
          docker rm hireflo-smoke

      # ── Report published digest ────────────────────────────────────────────
      - name: Report image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image pushed to GHCR"
          echo "   Tags : ${{ steps.meta.outputs.tags }}"
          echo "   Digest: ${{ steps.build.outputs.digest }}"

      # ── Trigger Render deployment ──────────────────────────────────────────
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMG_TAG="sha-${SHORT_SHA}"
          IMG_URL="ghcr.io%2F${IMAGE_OWNER}%2Fhireflo%3A${IMG_TAG}"

          echo "🚀 Triggering Render deployment with image tag: sha-${SHORT_SHA}"

          HTTP_STATUS=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}")

          echo "   Render response HTTP status: ${HTTP_STATUS}"
          cat /tmp/render_response.json

          if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "202" ]; then
            echo "✅ Render deployment triggered successfully"
          else
            echo "❌ Render deployment trigger failed (HTTP ${HTTP_STATUS})"
            exit 1
          fi
