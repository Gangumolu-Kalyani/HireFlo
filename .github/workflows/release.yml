# ============================================================
# HireFlo — Release Workflow
# ============================================================
#
# Triggered exclusively by semantic version tags: v*.*.*
# e.g.  git tag v1.0.0 && git push origin v1.0.0
#
# This workflow is SEPARATE from ci.yml which handles main/PR.
# Separation of concerns:
#   ci.yml      — development feedback loop (push/PR to main)
#   release.yml — production release gate   (v*.*.* tags only)
#
# Pipeline
# --------
# 1. lint          — ruff check .
# 2. test          — pytest -v  (fake LLM — no API key needed)
# 3. secret-scan   — Gitleaks full history scan
# 4. dep-scan      — pip-audit production dependencies
# 5. release       — build + Trivy + smoke test + push GHCR
#                    + Render deploy + health poll + GitHub Release
#
# Security failure policy (same as ci.yml)
# ----------------------------------------
# FAIL:    ruff violations
# FAIL:    pytest failures
# FAIL:    secrets detected by Gitleaks
# FAIL:    dependency vulnerability with a fix available
# FAIL:    CRITICAL Docker vulnerability (Trivy)
# FAIL:    HIGH Docker vulnerability with a fix available (Trivy)
# REPORT:  MEDIUM / LOW Docker vulnerability (never block)
#
# Images published for v1.0.0
# ----------------------------
#   ghcr.io/<owner>/hireflo:v1.0.0      ← human-readable, immutable
#   ghcr.io/<owner>/hireflo:1.0         ← major.minor convenience tag
#   ghcr.io/<owner>/hireflo:sha-<sha>   ← fully traceable, immutable
#
# Render deployment
# -----------------
# Deploys the immutable SHA tag via the deploy hook.
# The hook URL is stored in GitHub Secrets: RENDER_DEPLOY_HOOK_URL
#
# Deployment verification
# -----------------------
# After triggering Render, the workflow polls /_stcore/health
# for up to 5 minutes.  The GitHub Release is only created after
# a successful 200 response.
#
# GitHub Release
# --------------
# Created automatically with: version, commit SHA, image references,
# security scan summary, and deployment status.
# ============================================================

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Top-level: read source only.
# contents: write and packages: write are scoped to the release job only.
permissions:
  contents: read

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v
        env:
          APP_ENV: test

  # ── 3. Secret scanning ─────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Dependency vulnerability scan ──────────────────────────────────────
  dep-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Run pip-audit
        run: |
          echo "🔍 Scanning production dependencies for known vulnerabilities..."
          pip-audit -r requirements.txt

  # ── 5. Release: build + scan + push + deploy + verify + GitHub Release ─────
  release:
    name: Build, scan, push, deploy & release
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan, dep-scan]

    # contents: write — required to create the GitHub Release
    # packages: write — required to push to GHCR
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Derive version from the git tag ───────────────────────────────────
      # RELEASE_VERSION = "1.0.0"  (strips leading 'v')
      # TAG_NAME        = "v1.0.0"
      - name: Extract version information
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "tag=${TAG}"          >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release tag   : ${TAG}"
          echo "Version       : ${VERSION}"
          echo "Commit (short): ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Generate OCI-compliant image tags and labels ──────────────────────
      # For tag v1.0.0 this produces:
      #   ghcr.io/<owner>/hireflo:v1.0.0
      #   ghcr.io/<owner>/hireflo:1.0
      #   ghcr.io/<owner>/hireflo:sha-<short>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hireflo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=HireFlo
            org.opencontainers.image.description=AI Recruitment Agent — LangGraph + Streamlit
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ── Log in to GHCR ────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build the image locally for Trivy scan and smoke test ─────────────
      - name: Build image locally (scan + smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: hireflo:release
          cache-from: type=gha

      # ── Trivy vulnerability scan ──────────────────────────────────────────
      # A release must not be published if CRITICAL or HIGH (fixable) vulns
      # are found.  This scan runs on the locally-loaded image BEFORE push.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: hireflo:release
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "1"
          ignore-unfixed: true
          trivyignore: .trivyignore

      # ── Docker smoke test ─────────────────────────────────────────────────
      - name: Smoke-test release image
        run: |
          docker run -d \
            --name hireflo-release-smoke \
            -p 8501:8501 \
            -e APP_ENV=test \
            -e OPENROUTER_API_KEY=dummy \
            hireflo:release

          echo "Waiting for Streamlit health endpoint..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo ""
              echo "✅  Smoke test passed (attempt $i)"
              break
            fi
            echo "  attempt $i/10 — not ready yet, sleeping 3 s"
            sleep 3
          done

          curl -sf http://localhost:8501/_stcore/health || \
            (echo "❌  Smoke test failed" && docker logs hireflo-release-smoke && exit 1)

      # ── Non-root verification ─────────────────────────────────────────────
      - name: Verify non-root execution
        run: |
          CONTAINER_USER=$(docker exec hireflo-release-smoke whoami)
          echo "Container user: ${CONTAINER_USER}"
          if [ "${CONTAINER_USER}" = "root" ]; then
            echo "❌  SECURITY VIOLATION: container running as root"
            docker stop hireflo-release-smoke && docker rm hireflo-release-smoke
            exit 1
          fi
          echo "✅  Non-root verified: ${CONTAINER_USER}"
          docker stop hireflo-release-smoke && docker rm hireflo-release-smoke

      # ── Push versioned image to GHCR ──────────────────────────────────────
      # Only pushed after Trivy and smoke test pass — never publish
      # a vulnerable or broken image.
      - name: Push release image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Report pushed image digest
        run: |
          echo "✅ Release image pushed to GHCR"
          echo "   Version : ${{ steps.version.outputs.tag }}"
          echo "   Tags    : ${{ steps.meta.outputs.tags }}"
          echo "   Digest  : ${{ steps.build.outputs.digest }}"

      # ── Trigger Render deployment ─────────────────────────────────────────
      # Deploy the immutable SHA tag — not the version tag or latest.
      # Using the SHA guarantees Render runs the exact image that was scanned.
      - name: Trigger Render deployment
        id: render_deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          IMG_TAG="sha-${SHORT_SHA}"
          IMG_URL="ghcr.io%2F${IMAGE_OWNER}%2Fhireflo%3A${IMG_TAG}"

          echo "🚀 Deploying sha-${SHORT_SHA} to Render..."

          HTTP_STATUS=$(curl -s -o /tmp/render_response.json -w "%{http_code}" \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}")

          echo "   HTTP status: ${HTTP_STATUS}"
          cat /tmp/render_response.json || true

          if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "202" ]; then
            echo "✅ Render deploy triggered"
          else
            echo "❌ Render deploy trigger failed (HTTP ${HTTP_STATUS})"
            exit 1
          fi

      # ── Production health verification ────────────────────────────────────
      # Poll /_stcore/health for up to 5 minutes (30 attempts × 10 s).
      # The GitHub Release is only created after this step succeeds.
      # If HIREFLO_PROD_URL is not configured, skip with a warning.
      - name: Verify production health
        id: health_check
        env:
          HIREFLO_PROD_URL: ${{ secrets.HIREFLO_PROD_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.HIREFLO_PROD_URL != ''
        run: |
          HEALTH_URL="${HIREFLO_PROD_URL}/_stcore/health"
          echo "⏳ Polling ${HEALTH_URL} (max 5 min)..."

          for i in $(seq 1 30); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${HEALTH_URL}" || echo "000")
            echo "  attempt ${i}/30 — HTTP ${HTTP}"
            if [ "${HTTP}" = "200" ]; then
              echo "✅ Production is healthy (attempt ${i})"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Production health check timed out after 5 minutes"
          exit 1

      - name: Warn — production URL not configured
        env:
          HIREFLO_PROD_URL: ${{ secrets.HIREFLO_PROD_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL == '' || env.HIREFLO_PROD_URL == ''
        run: |
          echo "⚠️  One or more deployment secrets are not set — skipping live health verification."
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "   Missing: RENDER_DEPLOY_HOOK_URL"
            echo "   Add it to enable Render deployment in future releases."
          fi
          if [ -z "${HIREFLO_PROD_URL}" ]; then
            echo "   Missing: HIREFLO_PROD_URL"
            echo "   Add it to enable post-deploy health polling in future releases."
            echo "   Value format: https://hireflo.onrender.com  (no trailing slash)"
          fi

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "HireFlo ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # HireFlo ${{ steps.version.outputs.tag }}

            ## Release Information

            | Field | Value |
            |---|---|
            | Version | `${{ steps.version.outputs.tag }}` |
            | Commit | `${{ github.sha }}` |
            | Short SHA | `${{ steps.version.outputs.short_sha }}` |
            | Released | ${{ github.event.head_commit.timestamp }} |

            ## Docker Images

            | Tag | Reference | Immutable? |
            |---|---|---|
            | Version | `ghcr.io/${{ github.repository_owner }}/hireflo:${{ steps.version.outputs.tag }}` | ✅ Yes |
            | SHA | `ghcr.io/${{ github.repository_owner }}/hireflo:sha-${{ steps.version.outputs.short_sha }}` | ✅ Yes |
            | Digest | `${{ steps.build.outputs.digest }}` | ✅ Yes |

            ### Pull the release image

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/hireflo:${{ steps.version.outputs.tag }}
            ```

            ## Security Validation

            All checks passed before this release was published:

            | Check | Tool | Result |
            |---|---|---|
            | Lint | Ruff | ✅ Passed |
            | Tests | Pytest | ✅ Passed |
            | Secret scan | Gitleaks | ✅ Passed |
            | Dependency scan | pip-audit | ✅ Passed |
            | Image scan | Trivy (CRITICAL/HIGH) | ✅ Passed |
            | Smoke test | Streamlit health check | ✅ Passed |
            | Non-root | Container user check | ✅ Passed |
            | Provenance | BuildKit SBOM | ✅ Attached |

            ## Deployment

            Deployed to Render via immutable SHA tag:
            ```
            ghcr.io/${{ github.repository_owner }}/hireflo:sha-${{ steps.version.outputs.short_sha }}
            ```

            ## Rollback

            To roll back to a previous release, re-trigger Render with the previous image:

            ```bash
            # Replace v1.0.0 with the target version and <sha> with its commit SHA
            curl "https://api.render.com/deploy/srv-…?key=…&imgURL=ghcr.io%2F${{ github.repository_owner }}%2Fhireflo%3Av1.0.0"
            ```

            Or use the Render Dashboard → Deploys → select a previous deploy → Rollback.

            See [RELEASE.md](RELEASE.md) for the full rollback runbook.
